    <title>Leland — Live Programs</title>
    <script>
      // App-promo takeover embeds pages as ?mini=1 iframes. Inject the mini
      // stylesheet SYNCHRONOUSLY here — if React did it in an effect, the page
      // would paint fully once before the entrance styles applied, flashing all
      // its content for a frame.
      (function () {
        if (!new URLSearchParams(location.search).has("mini")) return;
        var css = [
          "html,body{scrollbar-width:none;-ms-overflow-style:none}",
          "::-webkit-scrollbar{display:none}",
          // Status-bar head-room: the nav grows taller, so the strip carries
          // the nav's own background (beige over the hero, white on scroll).
          "header.fixed{padding-top:24px;height:80px}",
          "@keyframes miniIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}",
          "h1,h1+p,section,section:nth-of-type(1)>div:nth-of-type(2)>*,section:nth-of-type(1)>button{opacity:0;animation:miniIn .5s cubic-bezier(.25,.1,.25,1) forwards}",
          "h1{animation-delay:.55s}h1+p{animation-delay:.75s}",
          "section:nth-of-type(1){animation-delay:1.05s}",
          "section:nth-of-type(1)>div:nth-of-type(2)>*:nth-child(1){animation-delay:1.4s}",
          "section:nth-of-type(1)>div:nth-of-type(2)>*:nth-child(2){animation-delay:1.6s}",
          "section:nth-of-type(1)>div:nth-of-type(2)>*:nth-child(3){animation-delay:1.8s}",
          "section:nth-of-type(1)>button{animation-delay:2.05s}",
          "section:nth-of-type(2){animation-delay:2.35s}",
          "section:nth-of-type(3){animation-delay:2.6s}",
          "section:nth-of-type(4){animation-delay:2.85s}",
          "section:nth-of-type(5){animation-delay:3.1s}"
        ].join("");
        var el = document.createElement("style");
        el.id = "mini-style";
        el.textContent = css;
        document.head.appendChild(el);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
