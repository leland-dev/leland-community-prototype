  h1, h2, h3 { font-family: 'SeasonMix', Georgia, serif; font-weight: 500; margin: 0; }

  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  .macro-stepper {
    display: flex; align-items: center; justify-content: center; gap: 0;
    padding: 22px 24px 0 24px; position: sticky; top: 0; z-index: 10; background: var(--white);
  }
  .macro-step { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .macro-step:hover .macro-label { color: var(--ink); }
  .macro-step:hover .macro-dot { border-color: var(--ink); }
  .macro-dot {
    width: 15px; height: 15px; border-radius: 50%; border: 2px solid #DEDAD1; background: var(--white);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; color: var(--white);
    transition: all 0.2s ease; box-sizing: content-box;
  }
  .macro-step.done .macro-dot { background: var(--ink); border-color: var(--ink); }
  .macro-ring {
    width: 23px; height: 23px; border-radius: 50%; padding: 2px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .macro-ring .macro-dot {
    width: 15px; height: 15px; margin: 0; background: var(--yellow); border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(245, 200, 75, 0.28);
  }
  .macro-label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .macro-step.done .macro-label, .macro-step.current .macro-label { color: var(--ink); }
  .macro-connector-track { width: 64px; height: 2px; background: #E9E6DF; margin: 0 14px; border-radius: 2px; overflow: hidden; }
  .macro-connector-fill { height: 100%; background: var(--ink); transition: width 0.35s ease; }

  .topbar { display: flex; flex-direction: column; gap: 10px; padding: 24px 40px 0 40px; }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; }
  .breadcrumb { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
  .progress-track { width: 100%; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.08); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--yellow); border-radius: 2px; transition: width 0.35s ease; }
  .exit-link {
    font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 500;
    background: var(--card); border-radius: var(--radius-md); padding: 8px 14px;
  }
  .exit-link:hover { background: var(--tan); color: var(--ink); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 24px 60px 24px; }
  .card-wrap { width: 100%; max-width: 640px; }

  .eyebrow {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--slate); margin-bottom: 14px;
  }
  .personalized-note { font-size: 13px; color: var(--muted); margin: -18px 0 24px 0; }
  .personalized-note strong { color: var(--ink); font-weight: 600; }
  h1.title { font-size: 2.3rem; line-height: 1.18; margin: 0 0 16px 0; }
  .subhead { font-size: 1.05rem; color: var(--muted); line-height: 1.6; margin: 0 0 28px 0; max-width: 560px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Macan', sans-serif; font-size: 15px; font-weight: 600;
    border-radius: var(--radius-md); padding: 14px 26px;
    cursor: pointer; border: none; transition: all 0.15s ease;
    text-decoration: none;
  }
  .btn-primary { background: var(--yellow); color: var(--ink); }
  .btn-primary:hover { filter: brightness(0.95); }
  .btn-secondary { background: var(--card); color: var(--ink); }
  .btn-secondary:hover { background: var(--tan); }
  .btn-sm { padding: 9px 16px; font-size: 13px; }
  .btn-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  .field-block { margin-bottom: 30px; }
  .field-label { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .field-hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 100px; background: var(--card); border: 2px solid transparent;
    font-family: 'Macan', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink);
    cursor: pointer; transition: all 0.15s ease;
  }
  .chip:hover { background: var(--cream); }
  .chip.selected { background: var(--white); border-color: var(--ink); font-weight: 600; }

  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .option-card {
    border-radius: var(--radius-lg); background: var(--card); padding: 18px 20px;
    cursor: pointer; border: 2px solid transparent; transition: all 0.15s ease;
  }
  .option-card:hover { background: var(--cream); }
  .option-card.selected { border-color: var(--ink); background: var(--white); box-shadow: var(--shadow-card); }
  .option-name { font-weight: 600; font-size: 15px; }
  .option-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .text-input, .number-input, .textarea-input {
    width: 100%; font-family: 'Macan', sans-serif; font-size: 15px; color: var(--ink);
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius-md);
    padding: 12px 14px; transition: all 0.15s ease;
  }
  .text-input:focus, .number-input:focus, .textarea-input:focus { outline: none; border-color: var(--ink); background: var(--white); }
  .text-input::placeholder, .number-input::placeholder, .textarea-input::placeholder { color: var(--muted); }
  .number-input { max-width: 140px; }
  .textarea-input { resize: vertical; min-height: 80px; font-family: 'Macan', sans-serif; }

  .dropdown-wrap { position: relative; }
  .dropdown-trigger {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: 'Macan', sans-serif; font-size: 15px; color: var(--ink); text-align: left;
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius-md);
    padding: 12px 14px; cursor: pointer; transition: all 0.15s ease;
  }
  .dropdown-trigger:hover { background: var(--cream); }
  .dropdown-trigger-text.placeholder { color: var(--muted); }
  .dropdown-chevron { display: flex; align-items: center; color: var(--muted); flex-shrink: 0; transition: transform 0.15s ease; }
  .dropdown-wrap.open .dropdown-trigger { border-color: var(--ink); background: var(--white); }
  .dropdown-wrap.open .dropdown-chevron { transform: rotate(180deg); color: var(--ink); }
  .dropdown-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: var(--white); border-radius: var(--radius-md); box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 6px; max-height: 280px; overflow-y: auto;
  }
  .dropdown-wrap.open .dropdown-panel { display: block; }
  .dropdown-option {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-family: 'Macan', sans-serif; font-size: 15px; color: var(--ink);
    padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s ease;
  }
  .dropdown-option:hover { background: var(--cream); }
  .dropdown-option.selected { background: var(--card); font-weight: 600; }
  .dropdown-check { color: var(--rust); font-weight: 700; flex-shrink: 0; }
  .time-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--card); }
  .time-row:last-child { border-bottom: none; }
  .time-label { font-size: 14px; color: var(--ink); max-width: 380px; }
  .time-input-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .time-input-wrap span { font-size: 13px; color: var(--muted); }

  .optional-tag {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--slate); color: var(--white); padding: 2px 8px; border-radius: 100px; margin-left: 8px;
  }

  .unit-toggle { display: flex; border: 1px solid var(--card); border-radius: 100px; overflow: hidden; flex-shrink: 0; }
  .unit-btn {
    border: none; background: var(--card); color: var(--muted); font-family: 'Macan', sans-serif;
    font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  .unit-btn.active { background: var(--ink); color: var(--white); }

  /* Q5 time slider — one question at a time */
  .time-slider-field { padding: 8px 0 4px; }
  .time-slider-question { font-size: 17px; color: var(--ink); font-weight: 500; line-height: 1.4; margin-bottom: 28px; }
  .time-slider-value { font-family: 'SeasonMix', Georgia, serif; font-size: 2.25rem; color: var(--rust); text-align: center; margin-bottom: 24px; }
  .time-slider-track {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px;
    background: var(--card); outline: none; cursor: pointer;
  }
  .time-slider-track::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--yellow); border: 3px solid var(--white); box-shadow: 0 2px 6px rgba(0,0,0,0.18); cursor: pointer;
  }
  .time-slider-track::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--white);
    box-shadow: 0 2px 6px rgba(0,0,0,0.18); cursor: pointer;
  }
  .time-slider-ticks { display: flex; justify-content: space-between; margin-top: 8px; pointer-events: none; }
  .time-slider-tick { width: 2px; height: 6px; border-radius: 1px; background: #D8D3C7; }
  .time-slider-tick-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .freq-label { font-size: 13px; color: var(--muted); text-align: center; margin-top: 28px; margin-bottom: 10px; }
  /* Keep the 4 frequency options on one line — scoped here rather than on .chip-grid/.chip
     directly, since those are shared with the Q6 multi-select grid, which does need to wrap. */
  .freq-chip-row { max-width: 100%; overflow-x: auto; }
  .freq-chip-row .chip-grid { flex-wrap: nowrap; }
  .freq-chip-row .chip { flex-shrink: 0; padding: 8px 14px; font-size: 13px; white-space: nowrap; }
  /* Q4's gap-task card is narrower than Q5's full-width slider column — force-nowrap there just
     barely fits and reads cramped, so let it wrap here instead of forcing a hard-to-notice scroll. */
  .gap-entry .freq-chip-row { overflow-x: visible; margin-bottom: 16px; }
  .gap-entry .freq-chip-row .chip-grid { flex-wrap: wrap; }
  .time-slider-dots { display: flex; justify-content: center; gap: 6px; margin: 24px 0 8px; }
  .time-slider-dot { width: 6px; height: 6px; border-radius: 3px; background: #E4E0D7; transition: all 0.2s ease; }
  .time-slider-dot.active { background: var(--rust); width: 18px; }

  .gap-entry { background: var(--white); border: 1px solid var(--card); box-shadow: var(--shadow-card); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 16px; }
  .gap-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .remove-btn {
    border: none; background: none; color: var(--rust); font-family: 'Macan', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .add-entry-btn {
    border: 1px dashed var(--slate); background: none; color: var(--ink); font-family: 'Macan', sans-serif;
    font-size: 14px; font-weight: 600; padding: 12px 16px; border-radius: var(--radius-md);
    cursor: pointer; width: 100%; margin-bottom: 20px; transition: background 0.15s ease;
  }
  .add-entry-btn:hover { background: var(--card); }

  .rank-chip-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .rank-chip {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--card); background: var(--card);
    border-radius: 100px; padding: 10px 16px; font-family: 'Macan', sans-serif; font-size: 14px;
    color: var(--ink); cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .rank-chip:hover { background: var(--cream); }
  .rank-chip.ranked { background: var(--white); border-color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; background: var(--ink); color: var(--white); font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .ai-tag {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    color: var(--rust); flex-shrink: 0; cursor: help;
  }
  .ai-tag::after {
    content: attr(data-tooltip);
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--white); font-size: 11px; font-weight: 500; line-height: 1.35;
    padding: 7px 10px; border-radius: 6px; width: max-content; max-width: 200px; text-align: center;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.15s ease; z-index: 30;
  }
  .ai-tag:hover::after, .ai-tag:focus-visible::after { opacity: 1; visibility: visible; }
  .personalizing-note { font-size: 13px; color: var(--muted); font-style: italic; margin: -8px 0 16px 0; }
  .btn-disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .skip-link { display: inline-block; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: none; padding: 0; font-family: 'Macan', sans-serif; transition: color 0.15s ease; }
  .skip-link:hover { color: var(--ink); }

  .info-card {
    background: var(--tan); border-radius: var(--radius-lg); padding: 22px 26px;
    margin-bottom: 24px; display: flex; gap: 16px; align-items: flex-start;
  }
  .info-card.blue { background: var(--blue); }
  .info-card.card { background: var(--card); }
  .info-card-icon { font-size: 20px; line-height: 1; margin-top: 1px; }
  .info-card-body { font-size: 15px; color: var(--ink); line-height: 1.55; }
  .info-card-body strong { color: var(--ink); font-weight: 600; }

  .resource-card {
    background: var(--card); border-radius: var(--radius-lg); padding: 18px 20px;
    margin-bottom: 24px; display: flex; gap: 16px; align-items: center;
  }
  .resource-icon {
    width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
  }
  .resource-body { flex: 1; min-width: 0; }
  .resource-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .resource-desc { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .resource-cta {
    background: var(--ink); color: var(--white); border: none; border-radius: var(--radius-md);
    padding: 10px 16px; font-family: 'Macan', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .resource-cta:hover { filter: brightness(1.3); }

  .connector-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .connector { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--card); border-radius: var(--radius-lg); padding: 18px 20px; }
  .connector.needs-attention { box-shadow: 0 0 0 2px var(--rust); animation: attnPulse 0.5s ease; }
  @keyframes attnPulse { 0% { box-shadow: 0 0 0 6px rgba(184,90,43,0); } 100% { box-shadow: 0 0 0 2px var(--rust); } }
  .connector-icon {
    width: 42px; height: 42px; border-radius: var(--radius-md); flex-shrink: 0; background: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 19px; overflow: hidden;
  }
  .connector-body { flex: 1; min-width: 200px; }
  .connector-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .connector-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .connector-link {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: none;
  }
  .connector-link:hover { text-decoration: underline; }
  .tag {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 100px; white-space: nowrap; background: var(--rust); color: var(--white);
  }
  .tag.optional { background: var(--slate); }
  .connector-status { font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .connector-action-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .status-pending { color: var(--muted); }
  .status-connected { color: var(--ink); }
  .status-skipped { color: var(--muted); }

  .connector-compact-list { background: var(--card); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 28px; }
  .connector-compact { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgba(34,34,34,0.08); }
  .connector-compact:last-child { border-bottom: none; }
  .connector-compact.needs-attention { box-shadow: inset 0 0 0 2px var(--rust); }
  .connector-compact .connector-icon { width: 30px; height: 30px; font-size: 14px; border-radius: var(--radius-sm); }
  .connector-compact .connector-name { flex: 1; font-size: 14px; }

  .connect-panel { margin-top: 4px; flex-basis: 100%; background: var(--white); border-radius: var(--radius-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .how-to-shared { background: var(--card); margin: 4px 0 22px 0; padding: 16px 18px; align-items: flex-start; }
  .how-to-shared .prompt-box { background: var(--white); align-self: stretch; }
  .step-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .how-to-text { font-size: 14px; color: var(--ink); line-height: 1.5; margin: 0; }
  .prompt-box {
    background: var(--card); border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .copy-btn { font-size: 12px; font-weight: 600; color: var(--ink); background: var(--cream); border: none; border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .wall-box { background: var(--card); border-radius: var(--radius-md); padding: 14px 16px; margin-top: 4px; display: flex; flex-direction: column; gap: 12px; }

  .confirm-check {
    display: inline-flex; align-items: center; gap: 9px; background: none; border: none; cursor: pointer;
    font-family: 'Macan', sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); padding: 6px 2px;
    transition: color 0.15s ease;
  }
  .confirm-check:hover { color: var(--ink); }
  .confirm-check.checked { color: var(--ink); }
  .confirm-check-box {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #DEDAD1; background: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .confirm-check.checked .confirm-check-box {
    background: var(--yellow); border-color: var(--yellow); color: var(--ink);
    animation: checkPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    0% { transform: scale(0.3); opacity: 0.3; }
    55% { transform: scale(1.3); }
    80% { transform: scale(0.92); }
    100% { transform: scale(1); opacity: 1; }
  }

  .check-list { display: flex; flex-direction: column; gap: 18px; margin: 40px 0; }
  .check-item { display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--muted); transition: color 0.3s ease; }
  .check-item.done { color: var(--ink); font-weight: 500; }
  .check-mark {
    width: 24px; height: 24px; border-radius: 50%; background: var(--card);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 12px; transition: all 0.3s ease;
  }
  .check-item.done .check-mark { background: var(--yellow); color: var(--ink); }
  .check-item.active .check-mark { background: var(--cream); }

  .reveal-card {
    background: var(--card); border-radius: var(--radius-lg); padding: 26px 28px; margin-bottom: 24px; text-align: left;
  }
  .reveal-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--rust); margin-bottom: 8px; }
  .reveal-title { font-size: 1.75rem; line-height: 1.15; margin-bottom: 10px; }
  .reveal-desc { font-size: 14px; color: var(--muted); line-height: 1.55; }

  /* ---- refined reveal (fluid, comprehensive) ---- */
  .reveal2-section { text-align: left; margin: 0 0 30px 0; }
  .reveal2-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--slate); margin-bottom: 16px; }
  .build-list { display: flex; flex-direction: column; gap: 18px; }
  .build-row { display: flex; gap: 15px; align-items: baseline; }
  .build-num { font-family: 'SeasonMix', Georgia, serif; font-size: 1.1rem; color: #C3BDAE; flex-shrink: 0; width: 22px; }
  .build-session { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); }
  .build-name { font-size: 15px; font-weight: 600; color: var(--ink); margin-top: 3px; line-height: 1.35; }
  .build-highlight-badge {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--rust); margin-left: 8px;
  }

<script>
// ---- tiny DOM-builder helpers (no innerHTML anywhere in this file) ----
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const key of Object.keys(attrs)) {
    const val = attrs[key];
    if (key === 'class') node.className = val;
    else if (key === 'id') node.id = val;
    else if (key.indexOf('on') === 0 && typeof val === 'function') node.addEventListener(key.slice(2), val);
    else node.setAttribute(key, val);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return node;
}
function svg(tag, attrs, ...children) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  attrs = attrs || {};
  for (const key of Object.keys(attrs)) {
    const val = attrs[key];
    if (key.indexOf('on') === 0 && typeof val === 'function') node.addEventListener(key.slice(2), val);
    else node.setAttribute(key, val);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number'
      ? document.createTextNode(String(c))
      : c);
  });
  return node;
}

// ---- persisted state, so a real page reload can resume where you left off ----
const STORE_KEY = 'aibp_getting_started_intake';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveStore(partial) {
  const current = loadStore();
  localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign(current, partial)));
}

function freshAnswers() {
  return {
    vendor: null,
    employmentStatus: 'employed',
    role: '', institution: '', industry: '',
    degreeLevel: '', jobSeekingType: '', targetIndustry: '',
    managesTeam: null, teamSize: '',
    motivations: [], motivationOther: '',

    rankedTasks: [],
    topFollowup: '',

// Ensure backward compatibility and heal malformed localStorage data from old mockup runs
function sanitizeStore(ans) {
  const defaults = freshAnswers();
  if (!ans || typeof ans !== 'object') return defaults;
  
  // Arrays
  if (!Array.isArray(ans.blockers)) ans.blockers = [];
  if (!Array.isArray(ans.motivations)) ans.motivations = [];
  if (!Array.isArray(ans.rankedTasks)) ans.rankedTasks = [];
  if (!Array.isArray(ans.tasksDelegated)) ans.tasksDelegated = [];
  if (typeof ans.dailyTasksText !== 'string') ans.dailyTasksText = '';
  if (typeof ans.goal !== 'string') ans.goal = '';

  // Objects
  if (!ans.weeklyHours || typeof ans.weeklyHours !== 'object') {
    ans.weeklyHours = Object.assign({}, defaults.weeklyHours);
  } else {
    for (const key of Object.keys(defaults.weeklyHours)) {
      if (typeof ans.weeklyHours[key] !== 'number') ans.weeklyHours[key] = defaults.weeklyHours[key];
    }
  }

  return ans;
}

function stepMeta(name) {

  return idx === -1 ? { n: 0, total: INTAKE_STEPS.length, isIntro: true, word: 'Question' } : { n: idx + 1, total: INTAKE_STEPS.length, isIntro: false, word: 'Question' };

// Gates each question's Continue button — every step here is required except intake-daily,
// which stays explicitly optional (marked with .optional-tag). intake-time-categories isn't
// listed because its slider always holds a valid value (defaults to 0 hrs/wk), so there's no
// "unanswered" state to block on.
function canContinue(step) {
  switch (step) {
    case 'intake-vendor':
      return !!answers.vendor;
    case 'intake-role': {
      const status = answers.employmentStatus;
      if (status === 'employed') {
        return !!answers.role && !!answers.industry && !!answers.managesTeam &&
          (answers.managesTeam !== 'Yes' || !!answers.teamSize);
      }
      if (status === 'student') {
        return !!answers.institution.trim() && !!answers.degreeLevel;
      }
      if (status === 'unemployed') {
        return !!answers.jobSeekingType;
      }
      if (status === 'freelance') {
        return !!answers.targetIndustry && !!answers.managesTeam &&
          (answers.managesTeam !== 'Yes' || !!answers.teamSize);
      }
      return false;
    }
    case 'intake-motivation':
      return answers.motivations.length > 0 &&
        (!answers.motivations.includes('Other') || !!answers.motivationOther.trim());
    case 'intake-goal':
      return !!answers.goal.trim();
    case 'intake-rank':
      return answers.rankedTasks.length > 0;
    case 'intake-topfollowup':
      return !!answers.topFollowup;
    case 'intake-tasks':
      return answers.tasksDelegated.length > 0 &&
        (!answers.tasksDelegated.includes('other') || !!answers.otherTask.trim());
    case 'intake-feeling':
      return !!answers.feeling;
    case 'intake-blocker':
      return answers.blockers.length > 0;
    default:
      return true;
  }
}

// Text inputs/textareas mutate `answers` directly on oninput without calling render() (so typing
// doesn't get interrupted by a full re-render mid-keystroke — see the dailyTasksText/hoursSliderField
// comments elsewhere). That means the Continue button's disabled state, which is computed at render
// time, would otherwise go stale while typing. Steps whose canContinue() depends on a text field call
// this directly instead of a full render() so the button's enabled state stays live.
function refreshContinueButton() {

  if (!btn) return;
  btn.classList.toggle('btn-disabled', !canContinue(currentStep));
}

function updateProgress(name) {
  const { n, total, isIntro, word } = stepMeta(name);
  document.getElementById('breadcrumbText').textContent = isIntro
    ? 'Personalized Intake Quiz'
    : 'Personalized Intake Quiz · ' + word + ' ' + n + ' of ' + total;
  if (!isIntro) lastNumberedStepN = n;
  const progressN = name === 'intake-welcome' ? 0 : lastNumberedStepN;
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = Math.round((progressN / total) * 100) + '%';
}

// Weekly-hours slider steps for the Q5 category-time question: fine-grained at the low end
// where the difference between 1 and 2 hrs/week matters, coarser past a full workday/week.
const WEEKLY_HOURS_STEPS = [0, 1, 2, 3, 5, 8, 12, 16, 20];
function formatWeeklyHours(hrs) {
  if (hrs === 0) return '0 hrs/wk';
  if (hrs >= 20) return '20+ hrs/wk';
  return `${hrs} hr${hrs === 1 ? '' : 's'}/wk`;
}
function formatWeeklyHoursShort(hrs) {
  if (hrs >= 20) return '20h+';
  return `${hrs}h`;
}
function hoursSliderIndex(hrs) {
  if (!hrs) return 0;
  const exact = WEEKLY_HOURS_STEPS.indexOf(hrs);
  if (exact !== -1) return exact;
  return WEEKLY_HOURS_STEPS.reduce((best, h, i) => Math.abs(h - hrs) < Math.abs(WEEKLY_HOURS_STEPS[best] - hrs) ? i : best, 0);
}
function hoursSliderField(question, hrs, onChange) {
  const idx = hoursSliderIndex(hrs);
  // Value label is updated by direct DOM mutation in oninput below, NOT by calling render() —
  // render() replaces this whole subtree (including the <input> being actively dragged), which is
  // what made the drag feel janky. Keeping the input node alive for the life of the drag gesture
  // is what makes native range-slider dragging feel smooth.
  const valueLabel = h('div', {class:'time-slider-value'}, formatWeeklyHours(WEEKLY_HOURS_STEPS[idx]));
  return h('div', {class:'time-slider-field'},
    h('div', {class:'time-slider-question'}, question),
    valueLabel,
    h('input', {
      class: 'time-slider-track', type: 'range', min: '0', max: String(WEEKLY_HOURS_STEPS.length - 1), step: '1', value: String(idx),
      oninput: (e) => {
        const newHrs = WEEKLY_HOURS_STEPS[Number(e.target.value)];
        valueLabel.textContent = formatWeeklyHours(newHrs);
        onChange(newHrs);
      }
    }),
    // Drawn manually rather than via <input list="..."> — a datalist's native tick marks don't
    // render once -webkit-appearance:none strips the track's native chrome (needed to style the
    // thumb/track ourselves). Evenly spaced to match the range input's linear 0..N step positions.
    h('div', {class:'time-slider-ticks'}, ...WEEKLY_HOURS_STEPS.map(() => h('span', {class:'time-slider-tick'}))),
    h('div', {class:'time-slider-tick-labels'}, ...WEEKLY_HOURS_STEPS.map(hrsVal => h('span', {}, formatWeeklyHoursShort(hrsVal))))
  );
}

function buildPersonalizedTaskOptions(excludeKeys) {
  const exclude = new Set(excludeKeys || []);
  const used = new Set();
  const personalized = [];
  (answers.personalizedOptions || []).forEach((opt, i) => {
    if (opt.mergeWithKey && TASK_LABEL_LOOKUP[opt.mergeWithKey] && !used.has(opt.mergeWithKey)) {
      used.add(opt.mergeWithKey);
      personalized.push({ key: opt.mergeWithKey, label: opt.label, personalized: true });
    } else {
      personalized.push({ key: 'custom-' + i, label: opt.label, personalized: true });
    }
  });
  const fixed = TASKS.filter(t => !exclude.has(t.key) && !used.has(t.key))
    .map(t => ({ key: t.key, label: t.label, personalized: false }));
  return personalized.concat(fixed);
}

function topTaskKey() {

function countUpEl(id, target, duration) {
  const el = document.getElementById(id);
  if (!el) return;
  const start = performance.now();
  function tick(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(eased * target);
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function countUpDecimal(id, target, duration, from) {
  const el = document.getElementById(id);
  if (!el) return;
  const startVal = from || 0;
  const start = performance.now();
  function tick(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = (startVal + (target - startVal) * eased).toFixed(1);
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
// Page 1's hero moment: draw the ring in showing "today," pause, then reshape the same ring
// to "with AI" proportions by swapping each slice's --offset/--stroke to its precomputed

// Once the reveal finishes, the legend and the before/after toggle fade in together (see

// actually played out, instead of the breakdown competing with it for attention immediately.
const RING_MORPH_MS = 1400; // must match the .donut-slice transition duration in CSS
const RING_PAUSE_MS = 2600; // how long the ring dwells on "today" before morphing

// Lets the before/after toggle re-drive the same ring after the auto-reveal has finished,
// without re-running the full reveal (and without touching render(), which would tear down
// and rebuild the whole step — see render()'s replaceChildren call).
// The ring's center number uses the same metric in both states ("hrs/wk on this" — a
// shrinking total, not time-spent swapping to time-saved mid-comparison). The actual reclaimed
// number gets its own large callout here instead, so it's not hidden as a side effect of that
// consistency — it's the headline stat, just presented once the shrink has actually happened.
// Crossfades out then back in on every state change so re-toggling back to "Today" doesn't
// leave a stale "With AI" number sitting there.
function setRingReclaimCallout(state, reclaimedHours) {

      el.classList.add('visible');

function runResultsRevealAnimation() {
  const curve = document.getElementById('resultsRing');
  if (!curve) return;
  const breakdown = computeResultsBreakdown();
  if (!breakdown) return;
  const todayHours = Number(breakdown.todayHours);
  const afterTotalHours = Number(breakdown.afterTotalHours);
  ringState = 'today';
  updateLegendValues('today', breakdown);

  requestAnimationFrame(() => requestAnimationFrame(() => curve.classList.add('drawn')));
  countUpDecimal('resultsCenterBig', todayHours, 1300);

      el.style.setProperty('--stroke', el.getAttribute('data-after-stroke') + 'px');

}
// Calculations for time categories and segments for the Donut chart
// Short label for the custom task category — Q5 only asks this when Q4 (dailyTasksText) was
// answered, so the specific thing they typed gets its own measured segment instead of being
// silently absorbed into one of the four fixed buckets.
function customTaskLabel() {
  const text = (answers.dailyTasksText || '').trim();
  if (!text) return 'Your specific task';
  return text.length > 40 ? text.slice(0, 40).trim() + '…' : text;
}

function getDonutSegments() {
  const wh = answers.weeklyHours || {};
  const commsMin = (wh.comms || 0) * 60;
  const dataMin = (wh.data || 0) * 60;
  const adminMin = (wh.admin || 0) * 60;
  const callsMin = (wh.calls || 0) * 60;
  const customTaskMin = (wh.customTask || 0) * 60;

  const totalMeasuredMin = commsMin + dataMin + adminMin + callsMin + customTaskMin;
  const totalWeekMin = 2400; // 40 hours — the reference frame the ring is drawn against

  const segments = [];
  // Every segment below is a direct answer, not a guess — rawMins === mins now that nothing
  // gets rescaled to fit a clamp (see the removed WORK_WEEK_ARCHETYPES system this replaced).
  if (commsMin > 0) {
    segments.push({ key: 'comms', label: 'Email & Slack', mins: commsMin, rawMins: commsMin, color: '#9685A8', isReclaimed: true });
  }
  if (dataMin > 0) {
    segments.push({ key: 'data', label: 'Data & Slides', mins: dataMin, rawMins: dataMin, color: '#D4AF37', isReclaimed: true });
  }
  if (adminMin > 0) {
    segments.push({ key: 'admin', label: 'Admin & Research', mins: adminMin, rawMins: adminMin, color: '#7A8B7B', isReclaimed: true });
  }
  if (callsMin > 0) {
    segments.push({ key: 'calls', label: 'Calls & Meetings', mins: callsMin, rawMins: callsMin, color: '#5C7C8A', isReclaimed: true });
  }
  if (customTaskMin > 0) {
    segments.push({ key: 'customTask', label: customTaskLabel(), mins: customTaskMin, rawMins: customTaskMin, color: '#9C5257', isReclaimed: true });
  }

  // Whatever's left of a standard 40-hr week after every direct answer above — genuinely
  // unknown, so it gets one honest "we don't know" bucket instead of a guessed, overlapping
  // multi-category split. isReclaimed: false keeps it out of the reclaim math entirely (see
  // computeResultsBreakdown) and out of the AI-facing raw time breakdown (see rawTimeBreakdown).
  const unspecifiedMin = Math.max(0, totalWeekMin - totalMeasuredMin);
  if (unspecifiedMin > 0) {
    segments.push({ key: 'unspecified', label: 'Everything else', mins: unspecifiedMin, rawMins: unspecifiedMin, color: '#BEBEBE', isReclaimed: false });
  }

  return { segments, totalMeasuredMin };
}

// Shared role/industry archetype detection — feeds both the session spotlight message
// and the "typical work week" breakdown below, so the two personalize off the same signal.
function detectArchetypeKey() {
  const role = (answers.role || '').toLowerCase();
  const industry = (answers.industry || answers.targetIndustry || '').toLowerCase();
  const jobSeeking = (answers.jobSeekingType || '').toLowerCase();

  if (industry.includes('finance') || role.includes('finance') || role.includes('accounting') || industry.includes('consulting') || role.includes('strategy')) {
    return 'finance';
  }
  if (role.includes('marketing') || role.includes('content') || jobSeeking.includes('marketing') || role.includes('sales') || role.includes('business development') || role.includes('customer success') || role.includes('account management')) {
    return 'marketing';
  }
  if (industry.includes('technology') || role.includes('product') || role.includes('engineering') || role.includes('operations') || role.includes('chief of staff')) {
    return 'tech';
  }
  return 'default';
}

// Builds one donut ring (svg + center label overlay) from a segment list — shared by the
// before/after comparison so both rings draw identically and animate off their own id.
// Each segment can carry a `tooltip` string, shown on hover over just its own arc (pointer
// events only fire on the painted portion of a dashed stroke, so slices don't overlap).
// Computes each segment's stroke-dasharray length + rotational offset for a given segment
// list, keyed by category — used to get both the "today" and "with AI" positions for the
// same ring so buildMorphingDonutRing can animate between them.
function donutOffsetsByKey(segments) {
  const radius = 38;
  const circumference = 2 * Math.PI * radius; // ~238.76
  let cumulativePercent = 0;
  const byKey = {};
  segments.forEach((seg) => {
    const segmentPercent = (seg.mins / 2400) * 100;
    const dashLength = (segmentPercent / 100) * circumference;
    const offset = -(cumulativePercent / 100) * circumference;
    cumulativePercent += segmentPercent;
    byKey[seg.key] = { offset, dashLength };
  });
  return byKey;
}

// The single hero ring for the results reveal: renders once for the union of "today" and
// "with AI" categories, initialized at the "today" shape. runResultsRevealAnimation() later
// swaps each circle's --offset/--stroke to the "with AI" values, and since .donut-slice
// transitions both stroke-dasharray and stroke-dashoffset, the ring visibly reshapes in
// place — existing wedges shrink, the new "Time reclaimed" wedge (after-only) grows in.
function buildMorphingDonutRing(beforeSegments, afterSegments, domId) {
  const radius = 38;
  const beforeByKey = {};
  beforeSegments.forEach(s => { beforeByKey[s.key] = s; });
  const afterByKey = {};
  afterSegments.forEach(s => { afterByKey[s.key] = s; });
  const beforeOffsets = donutOffsetsByKey(beforeSegments);
  const afterOffsets = donutOffsetsByKey(afterSegments);

  const beforeKeys = beforeSegments.map(s => s.key);
  const orderedKeys = [...beforeKeys, ...afterSegments.map(s => s.key).filter(k => !beforeKeys.includes(k))];

  const circleElements = orderedKeys.map((key) => {
    const seg = afterByKey[key] || beforeByKey[key];
    const before = beforeOffsets[key] || { offset: 0, dashLength: 0 };
    const after = afterOffsets[key] || { offset: 0, dashLength: 0 };
    return svg('circle', {
      class: 'donut-slice',
      cx: '50',
      cy: '50',
      r: String(radius),
      stroke: seg.color,
      'stroke-width': '10',
      fill: 'transparent',
      'data-key': key,
      'data-before-offset': before.offset.toFixed(2),
      'data-before-stroke': before.dashLength.toFixed(2),
      'data-after-offset': after.offset.toFixed(2),
      'data-after-stroke': after.dashLength.toFixed(2),
      style: `--offset: ${before.offset.toFixed(2)}px; --stroke: ${before.dashLength.toFixed(2)}px; cursor: pointer;`,
      onmouseenter: (e) => showChartTooltip(e, seg.tooltip || seg.label),
      onmousemove: positionChartTooltip,
      onmouseleave: hideChartTooltip,
    });
  });

  const svgElement = svg('svg', {
    viewBox: '0 0 100 100',
    class: 'rvcurve',
    id: domId,
    style: 'width: 300px; height: 300px; transform: rotate(-90deg); transform-origin: center; display: block; overflow: visible;'
  },
    svg('circle', {
      cx: '50',
      cy: '50',
      r: String(radius),
      stroke: '#FAF8F5',
      'stroke-width': '10',
      fill: 'transparent'
    }),
    ...circleElements
  );

  // Center label overlay (HTML, not SVG text, to avoid svg() text node issues)
  return h('div', {style: 'position: relative; width: 300px; height: 300px; flex-shrink: 0;'},
    svgElement,
    h('div', {style: 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;'},
      h('div', {id: 'resultsCenterBig', style: 'font-family: \'SeasonMix\', Georgia, serif; font-size: 2.4rem; font-weight: bold; color: var(--rust); line-height: 1;'}),
      h('div', {id: 'resultsCenterSmall', style: 'font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 6px; max-width: 140px;'})
    )
  );
}

// Used for the ring's hover tooltips, which still spell out both states at once since a
// tooltip is an on-demand detail, not the primary display — "before → after" for anything
// reclaimable, a plain label for the one zero-rate bucket ("Everything else" is just unknown).
function segmentValueText(seg, afterMinsByKey) {
  const beforeHours = (seg.mins / 60).toFixed(1);
  if (seg.key === 'unspecified') return `${beforeHours} hrs/wk · not tracked`;
  const afterHours = ((afterMinsByKey[seg.key] || 0) / 60).toFixed(1);
  return `${beforeHours} → ${afterHours} hrs/wk`;
}

// The legend's own value text is single-number and toggle-aware instead: it shows whichever
// state the ring is currently on (see ringState / setRingState), so the legend reads as "your
// time on this, right now" rather than always spelling out both states like the tooltip does.
function legendSingleValueText(seg, state, afterMinsByKey) {
  if (seg.key === 'unspecified') return `${(seg.mins / 60).toFixed(1)} hrs/wk · not tracked`;
  const mins = state === 'today' ? seg.mins : (afterMinsByKey[seg.key] || 0);
  return `${(mins / 60).toFixed(1)} hrs/wk`;
}

// Updates every legend row's displayed number in place when the ring toggle changes — mirrors
// setRingState's direct-DOM approach (no render(), so the ring's in-flight animation and the
// rest of the step's DOM stay untouched) — see each row's id in renderBreakdownLegend.
function updateLegendValues(state, breakdown) {
  const { legendRows, afterMinsByKey } = breakdown;
  legendRows.forEach(seg => {
    const el = document.getElementById('legendVal-' + seg.key);
    if (el) el.textContent = legendSingleValueText(seg, state, afterMinsByKey);
  });
}

// Before/after donut comparison. "Today" shows where the week currently goes. "With AI" shows
// each bucket shrinking by its own reclaim rate (RECLAIM_RATE) — not vanishing into one lump
// wedge — while Deep Work and "Everything else" hold still (their rate is 0). Every segment
// uses the same rate table and the same math now, so the ring's headline number and the
// %/work-weeks stat below it can't disagree — they're both summed from the same per-segment
// reclaimed minutes. All of it lives here once; the ring (page 1) and the legend (whichever
// page it's on) both consume this same computed shape.
function computeResultsBreakdown() {
  const { segments: beforeSegments, totalMeasuredMin } = getDonutSegments();
  if (totalMeasuredMin <= 0) return null;

  const afterMinsByKey = {};
  const afterSegments = [];
  let combinedReclaimedMin = 0;
  beforeSegments.forEach(s => {
    const rate = RECLAIM_RATE[s.key] || 0;
    const reclaimedMin = s.mins * rate;
    const afterMin = s.mins - reclaimedMin;
    combinedReclaimedMin += reclaimedMin;
    afterMinsByKey[s.key] = afterMin;
    if (afterMin > 0) afterSegments.push({ ...s, mins: afterMin });
  });

  const todayHours = (totalMeasuredMin / 60).toFixed(1);
  const workWeeks = Math.max(1, Math.round(combinedReclaimedMin * 52 / 60 / 40));
  const reclaimedPct = Math.min(99, Math.round((combinedReclaimedMin / 2400) * 100));
  const reclaimedHours = (combinedReclaimedMin / 60).toFixed(1);
  // Same metric as todayHours ("hrs/wk on this"), just the projected total after AI — the ring's
  // two states should read as one comparable number shrinking, not two different metrics
  // (a time-spent total, then suddenly a time-saved total) swapping in the same spot.
  const afterTotalHours = ((totalMeasuredMin - combinedReclaimedMin) / 60).toFixed(1);
  afterSegments.push({ key: 'reclaimed', label: 'Time reclaimed', mins: combinedReclaimedMin, color: '#F5C84B', isReclaimed: true });

  // Per-category "before → after" text, shared by the legend and the ring's hover tooltips
  // so hovering a slice says exactly what the legend row for it says.
  const tooltipByKey = {};
  beforeSegments.forEach(s => { tooltipByKey[s.key] = `${s.label}: ${segmentValueText(s, afterMinsByKey)}`; });

  const beforeSegmentsWithTooltip = beforeSegments.map(s => ({ ...s, tooltip: tooltipByKey[s.key] }));
  const afterSegmentsWithTooltip = afterSegments.map(s => ({
    ...s,
    tooltip: s.key === 'reclaimed' ? `Time reclaimed: ${reclaimedHours} hrs/wk` : tooltipByKey[s.key],
  }));

  // Legend: each category's cost, sorted highest to lowest — except "Everything else," which
  // always sorts last regardless of size, since it's not a real category to weigh against the
  // others, just whatever's left unaccounted for.
  const legendRows = [...beforeSegments].sort((a, b) => {
    if (a.key === 'unspecified') return 1;
    if (b.key === 'unspecified') return -1;
    return b.mins - a.mins;
  });

  return {
    beforeSegments: beforeSegmentsWithTooltip,
    afterSegments: afterSegmentsWithTooltip,
    afterMinsByKey,
    legendRows,
    reclaimedPct,
    workWeeks,
    todayHours,
    reclaimedHours,
    afterTotalHours,
  };
}

// The per-category rows plus the headline stat line — placed on whichever results page the
// dev toggle currently points at (see breakdownOnPage2). Each row's value tracks the ring
// toggle's current state (see legendSingleValueText/updateLegendValues) rather than always
// spelling out both before and after.
function renderBreakdownLegend(breakdown) {
  const { legendRows, afterMinsByKey, reclaimedHours, reclaimedPct, workWeeks } = breakdown;
  return h('div', {class: 'rvchart-card'},
    h('div', {class: 'reveal2-eyebrow', style: 'margin-bottom:8px;'}, 'Your time allocation'),
    h('div', {class: 'rvchart-legend'},
      ...legendRows.map(seg => h('div', {class: 'legend-item'},
        h('span', {class: 'legend-color', style: `background: ${seg.color};`}),
        h('span', {class: 'legend-label'}, seg.label),
        h('span', {class: 'legend-value', id: 'legendVal-' + seg.key}, legendSingleValueText(seg, ringState, afterMinsByKey))
      )),
      h('div', {class: 'legend-item legend-item-highlight'},
        h('span', {class: 'legend-color', style: 'background: #F5C84B;'}),
        h('span', {class: 'legend-label'}, 'Time reclaimed'),
        h('span', {class: 'legend-value'}, `${reclaimedHours} hrs/wk`)
      )
    ),
    h('p', {class: 'rvchart-cap', style: 'margin-top:10px; border-top: 1.5px solid #FAF8F5; padding-top: 12px;'},
      `On average, people reclaim about `, h('strong', {}, `${LEVEL1_AVG_RECLAIM_PCT}%`), ` of their time just from Level 1. Based on what you told us, you're projected to reclaim `, h('strong', {}, `${reclaimedPct}%`), ` of your work week — about `, h('strong', {}, `${workWeeks}`), ` work-weeks a year.`
    )
  );
}

function downloadShareCard() {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  const scale = 2;
  const w = 540;
  const h = 640;
  canvas.width = w * scale;
  canvas.height = h * scale;
  ctx.scale(scale, scale);
  
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(0, 0, w, h);
  
  const cp = 24;
  const cw = w - cp * 2;
  const ch = h - cp * 2;
  const cr = 12;
  
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'rgba(28, 25, 23, 0.06)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  
  drawRoundedRect(ctx, cp, cp, cw, ch, cr);
  ctx.fill();
  
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  
  const pad = 36;
  const cx = cp + pad;
  let cy = cp + pad;
  
  ctx.fillStyle = '#1C1917';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 16);
  ctx.lineTo(cx + 4, cy);
  ctx.lineTo(cx + 7, cy + 3);
  ctx.lineTo(cx + 3, cy + 19);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = 'rgba(28, 25, 23, 0.7)';
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy + 16);
  ctx.lineTo(cx + 10, cy);
  ctx.lineTo(cx + 13, cy + 3);
  ctx.lineTo(cx + 9, cy + 19);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#1C1917';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.fillText('Leland', cx + 18, cy + 15);
  
  const badgeText = 'AI BUILDER PROGRAM';
  ctx.font = 'bold 9px sans-serif';
  const badgeWidth = ctx.measureText(badgeText).width;
  const badgeX = w - cp - pad - badgeWidth - 16;
  ctx.fillStyle = '#FAF3DE';
  drawRoundedRect(ctx, badgeX, cy - 2, badgeWidth + 16, 20, 10);
  ctx.fill();
  ctx.fillStyle = '#8C6A18';
  ctx.fillText(badgeText, badgeX + 8, cy + 11);
  
  cy += 40;
  
  ctx.fillStyle = '#B25E38';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText('MY LEVEL 1 PLAN', cx, cy);
  
  cy += 28;
  
  ctx.fillStyle = '#1C1917';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('Here’s what I’m building.', cx, cy);
  
  cy += 50;
  
  // Same reclaim-rate math as the results page (computeResultsBreakdown) — was previously the
  // raw reported hours (timeSavingsWeeklyMinutes), overpromising vs. the rest of the page.
  const shareBreakdown = computeResultsBreakdown();
  const hrsText = shareBreakdown ? shareBreakdown.reclaimedHours : '0.0';
  const workWeeks = shareBreakdown ? shareBreakdown.workWeeks : 0;

  ctx.fillStyle = '#1C1917';
  ctx.font = '500 68px Georgia, serif';
  ctx.fillText(hrsText, cx, cy);
  const hrsWidth = ctx.measureText(hrsText).width;
  
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('hrs/wk', cx + hrsWidth + 8, cy - 4);
  
  ctx.fillStyle = '#706F6C';
  ctx.font = '12px sans-serif';
  ctx.fillText('back once my plan is running', cx + hrsWidth + 72, cy - 18);
  ctx.fillText(`— ≈ ${workWeeks} work-weeks a year.`, cx + hrsWidth + 72, cy);
  
  cy += 24;
  
  const chosenBuild = getChosenBuild();
  const boxY = cy;
  const boxH = 68;
  ctx.fillStyle = '#FAF5EE';
  drawRoundedRect(ctx, cx, boxY, cw - pad * 2, boxH, 8);
  ctx.fill();
  
  ctx.fillStyle = '#B25E38';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText('MY #1 BUILD', cx + 16, boxY + 22);
  
  ctx.fillStyle = '#1C1917';
  ctx.font = 'bold 15px sans-serif';
  const buildTitle = chosenBuild ? chosenBuild.title : 'My Demo Day Build';
  let truncatedTitle = buildTitle;
  if (ctx.measureText(truncatedTitle).width > cw - pad * 2 - 32) {
    while (ctx.measureText(truncatedTitle + '...').width > cw - pad * 2 - 32 && truncatedTitle.length > 0) {
      truncatedTitle = truncatedTitle.slice(0, -1);
    }
    truncatedTitle += '...';
  }
  ctx.fillText(truncatedTitle, cx + 16, boxY + 46);
  
  cy += boxH + 28;
  
  ctx.fillStyle = '#1C1917';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('Building across all four Level 1 sessions:', cx, cy);
  
  cy += 20;
  
  ctx.font = 'bold 12px sans-serif';
  CURRICULUM_BUILDS.forEach((b) => {
    ctx.fillStyle = '#B25E38';
    ctx.fillText('✓', cx, cy);
    ctx.fillStyle = '#1C1917';
    ctx.fillText(b.title, cx + 16, cy);
    cy += 22;
  });

  // Acquisition half of the card — addressed to whoever else sees it, not the student whose
  // plan the rest of the card describes. Matches the .sc-cta-box element in renderShareCard.
  cy += 14;
  const ctaBoxY = cy;
  const ctaBoxH = 54;
  ctx.fillStyle = '#F5C84B';
  drawRoundedRect(ctx, cx, ctaBoxY, cw - pad * 2, ctaBoxH, 8);
  ctx.fill();
  ctx.fillStyle = '#1C1917';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('Want AI to build something like this for you?', cx + 16, ctaBoxY + 24);
  ctx.fillText('joinleland.com/ai-builder →', cx + 16, ctaBoxY + 42);
  cy = ctaBoxY + ctaBoxH + 24;

  const footerLineY = h - cp - pad - 20;
  ctx.strokeStyle = '#E4E0D7';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, footerLineY);
  ctx.lineTo(w - cp - pad, footerLineY);
  ctx.stroke();

  const footerTextY = h - cp - pad + 2;
  ctx.fillStyle = '#706F6C';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText('Leland', cx, footerTextY);
  ctx.font = '10px sans-serif';
  ctx.fillText(' · AI Builder Program', cx + 38, footerTextY);

  const dataUrl = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.download = `leland-ai-builder-plan.png`;
  link.href = dataUrl;
  link.click();
}

function drawRoundedRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function copyShareLink(e) {
  const dummyLink = window.location.href;
  navigator.clipboard.writeText(dummyLink).then(() => {
    const btn = e.currentTarget;
    const origText = btn.innerHTML;
    btn.innerHTML = '✓ Link Copied!';
    btn.style.background = '#E6F4EA';
    btn.style.color = '#137333';
    btn.style.borderColor = '#34A853';
    setTimeout(() => {
      btn.innerHTML = origText;
      btn.style.background = '';
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  });
}

      );
    } else if (status === 'unemployed') {
      followUps.push(dropdownField('What type of work are you looking for?', JOB_SEEKING_OPTIONS, answers.jobSeekingType, (opt) => { answers.jobSeekingType = opt; render(); }));
    } else if (status === 'freelance') {
      followUps.push(dropdownField('What industry are you targeting?', INDUSTRY_OPTIONS, answers.targetIndustry, (opt) => { answers.targetIndustry = opt; render(); }));
    }
    if (status === 'employed' || status === 'freelance') {
      followUps.push(h('div', {class:'field-block'},
        h('div', {class:'field-label'}, 'Do you manage a team?'),
        h('div', {class:'option-grid'}, ...['Yes','No'].map(opt => h('div', {
          class: 'option-card' + (answers.managesTeam === opt ? ' selected' : ''),
          onclick: () => { answers.managesTeam = opt; if (opt === 'No') answers.teamSize = ''; render(); }
        }, h('div', {class:'option-name'}, opt))))
      ));
      if (answers.managesTeam === 'Yes') {
        followUps.push(dropdownField('Team size', TEAM_SIZE_OPTIONS, answers.teamSize, (opt) => { answers.teamSize = opt; render(); }));
      }
    }
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-role').n),
      h('h1', {class:'title'}, 'What is your employment status?'),
      h('div', {class:'field-block'},
        h('div', {class:'option-grid'}, ...['employed','student','freelance','unemployed'].map(key => h('div', {
          class: 'option-card' + (status === key ? ' selected' : ''),
          onclick: () => { answers.employmentStatus = key; render(); }
        }, h('div', {class:'option-name'}, key.charAt(0).toUpperCase() + key.slice(1)))))
      ),
      ...followUps,
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-vendor')}, 'Back'),
        h('button', {
          id: 'continueBtn',
          class: 'btn btn-primary' + (canContinue('intake-role') ? '' : ' btn-disabled'),
          onclick: () => { if (canContinue('intake-role')) goTo('intake-motivation'); }
        }, 'Continue')
      )
    );
  },

  'intake-motivation': () => h('div', {},
    h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-motivation').n),
    h('h1', {class:'title'}, "Why are you starting Level 1 now?"),
    h('p', {class:'subhead'}, 'Select all that apply.'),
    h('div', {class:'option-grid', style:'grid-template-columns: 1fr;'}, ...MOTIVATION_OPTIONS.map(opt => h('div', {
      class: 'option-card' + (answers.motivations.includes(opt) ? ' selected' : ''),
      onclick: () => { toggleInArray(answers.motivations, opt); render(); }
    }, h('div', {class:'option-name'}, opt)))),
    answers.motivations.includes('Other') ? h('div', {class:'field-block', style:'margin-top:16px;'},
      h('div', {class:'field-label'}, 'Tell us more'),
      h('input', {class:'text-input', type:'text', value: answers.motivationOther, oninput: (e) => { answers.motivationOther = e.target.value; refreshContinueButton(); }})
    ) : null,
    h('div', {class:'btn-row'},
      h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-role')}, 'Back'),
      h('button', {
        id: 'continueBtn',
        class: 'btn btn-primary' + (canContinue('intake-motivation') ? '' : ' btn-disabled'),
        onclick: () => { if (canContinue('intake-motivation')) goTo('intake-goal'); }
      }, 'Continue')
    )
  ),

  'intake-goal': () => h('div', {},
    h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-goal').n),
    h('h1', {class:'title'}, 'What do you want to achieve by the end of this program?'),
    h('p', {class:'subhead'}, "A sentence or two is plenty — it helps us tailor the program to what you're after."),
    h('textarea', {
      class: 'textarea-input', style: 'min-height: 100px;',
      placeholder: 'e.g. Walk away with an automation that saves me a few hours a week on client reporting.',
      oninput: (e) => { answers.goal = e.target.value; refreshContinueButton(); }
    }, answers.goal),
    h('div', {class:'btn-row'},
      h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-motivation')}, 'Back'),
      h('button', {
        id: 'continueBtn',
        class: 'btn btn-primary' + (canContinue('intake-goal') ? '' : ' btn-disabled'),
        onclick: () => { if (canContinue('intake-goal')) goTo('intake-transition'); }
      }, 'Continue')
    )
  ),

  'intake-transition': () => h('div', {class:'center'},
    h('h1', {class:'title'}, "Now let's map out where your time actually goes."),
    h('p', {class:'subhead'}, "A few questions about your day-to-day work — be as specific as you can."),
    h('div', {class:'btn-row', style:'justify-content:center; margin-top:8px;'},
      h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-goal')}, 'Back'),
      h('button', {class:'btn btn-primary', onclick: () => goTo('intake-daily')}, 'Continue')
    )
  ),

  'intake-daily': () => h('div', {},
    h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-daily').n),
    h('h1', {class:'title'}, 'What do you spend time on most days?', h('span', {class:'optional-tag'}, 'Optional')),
    h('p', {class:'subhead'}, "Walk us through a typical day — meetings, projects, admin, whatever it is. Doesn't need to be polished."),
    h('textarea', {
      class: 'textarea-input', style: 'min-height: 140px;',
      placeholder: 'e.g. Updating the same deal-status spreadsheet after every call, then recapping it over email to my manager.',
      oninput: (e) => { answers.dailyTasksText = e.target.value; }
    }, answers.dailyTasksText),
    h('div', {class:'btn-row'},
      h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-transition')}, 'Back'),
      h('button', {class:'btn btn-primary', onclick: () => { triggerPersonalization(); categoryQuestionIndex = 0; goTo('intake-time-categories'); }}, 'Continue')
    )
  ),

  'intake-time-categories': () => {
    const questions = getTimeCategoryQuestions();
    const q = questions[categoryQuestionIndex];
    const isFirst = categoryQuestionIndex === 0;
    const isLast = categoryQuestionIndex === questions.length - 1;
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-time-categories').n + ' · ' + (categoryQuestionIndex + 1) + ' of ' + questions.length),
      h('h1', {class:'title'}, 'About how many hours a week do you spend on this?'),
      hoursSliderField(q.label + ' — ' + q.hint, answers.weeklyHours[q.key], (hrs) => {
        // No render() here on purpose — see the comment in hoursSliderField. State is picked up
        // correctly whenever Back/Next/Continue below calls render() next.
        answers.weeklyHours[q.key] = hrs;
      }),
      h('div', {class:'time-slider-dots'}, ...questions.map((_, i) => h('span', {class:'time-slider-dot' + (i === categoryQuestionIndex ? ' active' : '')}))),
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => { if (isFirst) { goTo('intake-daily'); } else { categoryQuestionIndex -= 1; render(); } }}, 'Back'),
        h('button', {class:'btn btn-primary', onclick: () => {
          if (isLast) { goTo(timeSavingsWeeklyMinutes() > 0 ? 'intake-timesavings' : 'intake-rank'); }
          else { categoryQuestionIndex += 1; render(); }
        }}, isLast ? 'Continue' : 'Next')
      )
    );
  },

  'intake-timesavings': () => h('div', {class:'center'},
    h('div', {class:'ts-tier', id:'ts-tier-week'},
      h('p', {class:'subhead', style:'margin-bottom:4px;'}, "Every week, that's..."),
      h('div', {class:'timesavings-number'}, h('span', {id:'tsWeek'}, '0'), h('span', {class:'timesavings-unit'}, 'min'))
    ),
    h('div', {class:'ts-tier', id:'ts-tier-month'},
      h('p', {class:'subhead', style:'margin-bottom:4px;'}, "Every month, that's..."),
      h('div', {class:'timesavings-number'}, h('span', {id:'tsMonth'}, '0'), h('span', {class:'timesavings-unit'}, 'hrs'))
    ),
    h('div', {class:'ts-tier', id:'ts-tier-year'},
      h('p', {class:'subhead', style:'margin-bottom:4px;'}, "Every year? That's..."),
      h('div', {class:'timesavings-number lg'}, h('span', {id:'tsYear'}, '0'), h('span', {class:'timesavings-unit'}, 'hrs')),
      h('p', {class:'subhead'}, "That's more than ", h('strong', {}, h('span', {id:'tsYearDays'}, '0'), ' full work days'), " a year — all on tasks Level 1 is built to hand back to you.")
    ),
    h('div', {class:'btn-row', style:'justify-content:center; margin-top:8px;'},
      h('button', {class:'btn btn-secondary', onclick: () => { categoryQuestionIndex = getTimeCategoryQuestions().length - 1; goTo('intake-time-categories'); }}, 'Back'),
      h('button', {class:'btn btn-primary', onclick: () => goTo('intake-rank')}, 'Continue')
    )
  ),

  'intake-rank': () => {
    triggerPersonalization();
    const options = buildRankOptions();
    const loading = personalizationStatus === 'loading';
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-rank').n),
      h('h1', {class:'title'}, 'Which of these would you most want off your plate?'),
      h('p', {class:'subhead'}, 'Tap to rank your top 3 — first tap is your #1 priority.'),
      loading ? h('p', {class:'personalizing-note'}, 'Personalizing your options…') : null,
      h('div', {class:'rank-chip-grid'}, ...options.map(opt => {
        const rankIdx = answers.rankedTasks.findIndex(r => r.key === opt.key);
        return h('button', {
          type: 'button',
          class: 'rank-chip' + (rankIdx !== -1 ? ' ranked' : ''),
          onclick: () => toggleRank(opt)
        },
          rankIdx !== -1 ? h('span', {class:'rank-badge'}, String(rankIdx + 1)) : null,
          h('span', {}, opt.label),
          opt.personalized ? aiSuggestedTag() : null
        );
      })),
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo(timeSavingsWeeklyMinutes() > 0 ? 'intake-timesavings' : 'intake-time-categories')}, 'Back'),
        h('button', {
          id: 'continueBtn',
          class: 'btn btn-primary' + (canContinue('intake-rank') ? '' : ' btn-disabled'),
          onclick: () => { if (canContinue('intake-rank')) goTo('intake-topfollowup'); }
        }, 'Continue')
      )
    );
  },

  'intake-topfollowup': () => {
    const top = topRanked();
    const label = top ? top.label : 'that task';
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-topfollowup').n),
      h('h1', {class:'title'}, 'How would you describe the process for "' + label + '" today?'),
      h('div', {class:'option-grid', style:'grid-template-columns: 1fr;'}, ...TOP_FOLLOWUP_OPTIONS.map(opt => h('div', {
        class: 'option-card' + (answers.topFollowup === opt.key ? ' selected' : ''),
        onclick: () => { answers.topFollowup = opt.key; render(); }
      }, h('div', {class:'option-name'}, opt.label)))),
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-rank')}, 'Back'),
        h('button', {
          id: 'continueBtn',
          class: 'btn btn-primary' + (canContinue('intake-topfollowup') ? '' : ' btn-disabled'),
          onclick: () => { if (canContinue('intake-topfollowup')) goTo('intake-tasks'); }
        }, 'Continue')
      )
    );
  },

  'intake-tasks': () => {
    triggerPersonalization();
    const loading = personalizationStatus === 'loading';
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-tasks').n),
      h('h1', {class:'title'}, 'Which of these do you currently use AI for?'),
      h('p', {class:'subhead'}, "Pick everything that applies — this helps us tailor the program to what you're after."),
      loading ? h('p', {class:'personalizing-note'}, 'Personalizing your options…') : null,
      chipGrid(buildTaskChipOptions(), answers.tasksDelegated, (key) => { toggleInArray(answers.tasksDelegated, key); render(); }),
      answers.tasksDelegated.includes('other')
        ? h('div', {class:'field-block', style:'margin-top:16px;'},
            h('div', {class:'field-label'}, 'What else?'),
            h('input', {class:'text-input', type:'text', value: answers.otherTask, oninput: (e) => { answers.otherTask = e.target.value; refreshContinueButton(); }})
          )
        : null,
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-topfollowup')}, 'Back'),
        h('button', {
          id: 'continueBtn',
          class: 'btn btn-primary' + (canContinue('intake-tasks') ? '' : ' btn-disabled'),
          onclick: () => { if (canContinue('intake-tasks')) goTo('intake-feeling'); }
        }, 'Continue')
      )
    );
  },

  'intake-feeling': () => h('div', {},
    h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-feeling').n),
    h('h1', {class:'title'}, 'Overall, how do you feel AI is performing for you so far?'),
    h('div', {class:'option-grid', style:'grid-template-columns: 1fr;'}, ...FEELING_OPTIONS.map(opt => h('div', {
      class: 'option-card' + (answers.feeling === opt.key ? ' selected' : ''),
      onclick: () => { answers.feeling = opt.key; render(); }
    }, h('div', {class:'option-name'}, opt.label)))),
    h('div', {class:'btn-row'},
      h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-tasks')}, 'Back'),
      h('button', {
        id: 'continueBtn',
        class: 'btn btn-primary' + (canContinue('intake-feeling') ? '' : ' btn-disabled'),
        onclick: () => { if (canContinue('intake-feeling')) goTo('intake-blocker'); }
      }, 'Continue')
    )
  ),

  'intake-blocker': () => {
    // Warm-start the build-suggestions call here (last real question) so it has a head
    // start on the network round trip before intake-finish renders and needs the result.
    triggerBuildSuggestions();
    return h('div', {},
      h('div', {class:'eyebrow'}, 'Question ' + stepMeta('intake-blocker').n),
      h('h1', {class:'title'}, "What's held you back from using AI more so far?"),
      h('p', {class:'subhead'}, 'Select all that apply.'),
      h('div', {class:'option-grid', style:'grid-template-columns: 1fr;'}, ...BLOCKER_OPTIONS.map(opt => h('div', {
        class: 'option-card' + (answers.blockers.includes(opt) ? ' selected' : ''),
        onclick: () => { toggleInArray(answers.blockers, opt); render(); }
      }, h('div', {class:'option-name'}, opt)))),
      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-feeling')}, 'Back'),
        h('button', {
          id: 'continueBtn',
          class: 'btn btn-primary' + (canContinue('intake-blocker') ? '' : ' btn-disabled'),
          onclick: () => { if (canContinue('intake-blocker')) goTo('intake-finish'); }
        }, 'Finish')
      )
    );
  },

  'intake-finish': () => {
    const breakdown = computeResultsBreakdown();
    return h('div', {class:'center'},
      h('div', {class:'eyebrow'}, 'Your Level 1 blueprint'),
      h('h1', {class:'title'}, "Here's your Level 1 blueprint"),
      h('p', {class:'subhead'}, "Based on what you told us — where your time goes today, and what AI can hand back."),
      breakdown ? h('div', {style:'display:flex; justify-content:center; margin: 32px 0 4px 0;'},
        buildMorphingDonutRing(breakdown.beforeSegments, breakdown.afterSegments, 'resultsRing')
      ) : null,
      // Fades in the instant the ring flips to "With AI" (see setRingReclaimCallout) — timed to
      // the transition itself, not gated behind the fuller reveal below. This is the headline
      // reclaimed-hours stat, now that the ring's own center number stays on a consistent
      // "hrs/wk on this" metric across both states instead of switching to it mid-comparison.
      breakdown ? h('div', {id: 'ringReclaimCallout', class: 'ring-reclaim-callout'}) : null,
      // Hidden until the reveal animation finishes (see runResultsRevealAnimation) so the ring
      // itself is the focus first; both fade in together once the comparison has played out.
      breakdown ? h('div', {class:'reveal-gated', style:'display:flex; justify-content:center; margin: 4px 0 20px 0;'},
        h('div', {class:'ring-toggle'},
          h('button', {id:'ringToggleToday', class:'active', onclick: () => setRingState('today')}, 'Today'),
          h('button', {id:'ringToggleAi', class:'', onclick: () => setRingState('ai')}, 'With AI')
        )
      ) : null,
      (breakdown && !breakdownOnPage2) ? h('div', {class:'reveal-gated'}, renderBreakdownLegend(breakdown)) : null,
      h('div', {class:'reveal-gated curriculum-card', style:'text-align:left; margin-top: 20px;'},
        h('div', {class:'reveal2-eyebrow', style:'margin-bottom: 10px;'}, 'Your goal for this program'),
        editingGoalOnResults
          ? h('div', {},
              h('textarea', {
                class: 'textarea-input', style: 'min-height: 90px;',
                placeholder: 'What do you want to achieve by the end of this program?',
                oninput: (e) => { answers.goal = e.target.value; }
              }, answers.goal),
              h('div', {class:'btn-row', style:'margin-top: 10px;'},
                h('button', {class:'btn btn-secondary btn-sm', onclick: () => { editingGoalOnResults = false; render(); }}, 'Cancel'),
                h('button', {class:'btn btn-primary btn-sm', onclick: () => { editingGoalOnResults = false; saveStore({goal: answers.goal}); render(); }}, 'Save')
              )
            )
          : h('div', {},
              h('div', {style:'font-size:15px; color:var(--ink); line-height:1.5;'},
                answers.goal || h('span', {style:'color:var(--muted); font-style:italic;'}, "You didn't add a goal — add one now if you want it on record.")
              ),
              h('button', {class:'skip-link', style:'margin-top:10px;', onclick: () => { editingGoalOnResults = true; render(); }}, 'Edit')
            )
      ),
      h('div', {class:'reveal-gated btn-row', style:'margin-top: 16px;'},
        h('button', {class:'btn btn-secondary', style:'flex: 1;', onclick: openShareModal}, 'Share results'),
        h('button', {class:'btn btn-primary', style:'flex: 1;', onclick: () => resetAll()}, 'Restart preview →')
      ),
      h('div', {class:'btn-row', style:'justify-content:center; margin-top: 12px;'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-blocker')}, 'Back')
      )
    );
  },

  'intake-results-more': () => {
    triggerBuildSuggestions();
    const breakdown = computeResultsBreakdown();
    const otherIdeas = (answers.aiOtherIdeas && answers.aiOtherIdeas.length) ? answers.aiOtherIdeas : buildFallbackOtherIdeas();
    const spotlight = getSpotlightInfo();

    return h('div', {},
      h('div', {class:'eyebrow'}, 'Your Level 1 blueprint'),
      h('h1', {class:'title'}, 'Other ways to reclaim time'),

      (breakdown && breakdownOnPage2) ? renderBreakdownLegend(breakdown) : null,

      h('div', {class:'reveal2-section', style:'margin-top: 24px;'},
        h('div', {class: 'spotlight-banner'},
          h('span', {class: 'spotlight-icon-badge'}, '💡'),
          h('div', {},
            h('div', {class: 'spotlight-eyebrow'}, 'Session spotlight'),
            h('div', {class: 'spotlight-text'}, spotlight.message)
          )
        ),

        h('div', {class: 'curriculum-card'},
          h('div', {class:'reveal2-eyebrow', style:'margin-bottom: 0;'}, "Building across all four Level 1 sessions:"),
          h('div', {class:'check-list-simple'}, ...CURRICULUM_BUILDS.map((b, i) => [
            h('div', {class: 'check-item-simple'},
              h('span', {class:'check-mark-simple'}, '✓'),
              h('div', {},
                h('div', {class:'check-session-label'}, b.session + ' deliverable'),
                h('div', {class:'check-item-title'}, b.title)
              )
            ),
            // Session 2 scoping note — sits right under the "Session 2 deliverable" label above, so it reads in context instead of restating which session it's about
            i === 1 ? h('div', {class: 'session-note'},
              h('strong', {}, 'Pay close attention here. '),
              'Session 2 is where you scope and build your own automation from scratch — this is the one to bring your real work problem to.'
            ) : null
          ]))
        )
      ),

      (otherIdeas && otherIdeas.length) ? h('div', {class:'reveal2-section reveal2-section-divided'},
        h('div', {class:'reveal2-eyebrow'}, "Other ideas worth building"),
        h('div', {class:'beyond-list'}, ...otherIdeas.map(idea => h('div', {class:'beyond-row'},
          h('span', {class:'beyond-check'}, '→'),
          h('div', {},
            h('div', {class:'beyond-title'}, idea.title),
            h('div', {class:'beyond-desc'}, idea.description),
            h('button', {
              class: 'btn-copy-prompt-sm',
              onclick: (e) => {
                e.preventDefault();
                const promptText = `Claude, I want to build "${idea.title}"${idea.description ? ': ' + idea.description : ''}. Ask me about inputs, outputs, and structure.`;
                navigator.clipboard.writeText(promptText).then(() => {
                  const btn = e.currentTarget;
                  const label = btn.querySelector('.btn-copy-label');
                  const origText = label.textContent;
                  label.textContent = '✓ Copied!';
                  btn.classList.add('copied');
                  setTimeout(() => { label.textContent = origText; btn.classList.remove('copied'); }, 2000);
                });
              }
            }, svgSparkle(11), h('span', {class: 'btn-copy-label'}, 'Copy prompt'))
          )
        )))
      ) : null,

      h('div', {class:'btn-row'},
        h('button', {class:'btn btn-secondary', onclick: () => goTo('intake-finish')}, 'Back')
      ),
      h('div', {class:'btn-row', style:'margin-top: 12px; gap: 12px;'},
        h('button', {class:'btn btn-secondary', style:'flex: 1;', onclick: openShareModal}, 'Share results'),
        h('button', {class:'btn btn-primary', style:'flex: 1;', onclick: () => resetAll()}, 'Restart preview →')
      )
    );
  },
};

render();
</script>

</body>
</html>
