<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="#f6efe3"/><circle cx="1120" cy="60" r="220" fill="#c79a4a" opacity="0.12"/><circle cx="60" cy="600" r="200" fill="#c79a4a" opacity="0.10"/><rect x="144" y="72" width="912" height="900" rx="6" fill="#000" opacity="0.05"/><rect x="130" y="84" width="940" height="900" rx="6" fill="#fff" opacity="1" stroke="#e7e3d8" stroke-width="1.5"/><text x="194" y="158" font-size="16" font-weight="700" fill="#8a6628" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Lead brief</text><text x="194" y="198" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Northwind Logistics</text><rect x="194" y="224" width="86.0" height="33" rx="16" fill="#e8f0fe" opacity="1"/><text x="237.0" y="246" font-size="14" font-weight="600" fill="#2a52be" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Series B</text><rect x="290.0" y="224" width="126.0" height="33" rx="16" fill="#f4f4f1" opacity="1"/><text x="353.0" y="246" font-size="14" font-weight="600" fill="#555" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">420 employees</text><rect x="426.0" y="224" width="110.0" height="33" rx="16" fill="#f4f4f1" opacity="1"/><text x="481.0" y="246" font-size="14" font-weight="600" fill="#555" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Chicago, IL</text><line x1="194" y1="286" x2="1006" y2="286" stroke="#ece6d6" stroke-width="1.5"/><text x="194" y="344" font-size="15" font-weight="700" fill="#8a6628" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Why now</text><text x="194" y="378" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Northwind closed a $38M Series B in March and is hiring aggressively</text><text x="194" y="405" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">across operations, with 40 open roles posted in the last six weeks. The</text><text x="194" y="432" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">round was led by investors focused on logistics infrastructure, which</text><text x="194" y="459" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">usually signals a push to scale dispatch and fleet operations fast.</text><line x1="194" y1="506" x2="1006" y2="506" stroke="#f1ede1" stroke-width="1.5"/><text x="194" y="526" font-size="15" font-weight="700" fill="#8a6628" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Pain points</text><text x="194" y="560" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Dispatch is still coordinated by hand across spreadsheets and phone</text><text x="194" y="587" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">calls, which doesn&#x27;t hold up as headcount grows. Fuel costs are also up</text><text x="194" y="614" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">sharply this quarter, and the team has mentioned wanting better</text><text x="194" y="641" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">visibility into route efficiency to offset it.</text><line x1="194" y1="688" x2="1006" y2="688" stroke="#f1ede1" stroke-width="1.5"/><text x="194" y="708" font-size="15" font-weight="700" fill="#8a6628" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Who to talk to</text><text x="194" y="742" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Dana Lee, VP of Operations, owns the dispatch workflow and has posted</text><text x="194" y="769" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">publicly about the team&#x27;s scaling challenges. She&#x27;s the most likely</text><text x="194" y="796" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">champion for a tool that saves dispatcher time.</text><line x1="194" y1="843" x2="1006" y2="843" stroke="#f1ede1" stroke-width="1.5"/><text x="194" y="863" font-size="15" font-weight="700" fill="#8a6628" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Opener</text><text x="194" y="897" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Congrats on the raise — I saw you&#x27;re scaling the ops team fast. How are</text><text x="194" y="924" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">you thinking about dispatch as headcount grows, and is manual</text><text x="194" y="951" font-size="18" font-weight="500" fill="#333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">coordination starting to show cracks?</text>
</svg>