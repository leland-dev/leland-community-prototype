<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="#fbe9e9"/><circle cx="1120" cy="60" r="220" fill="#d95c5c" opacity="0.12"/><circle cx="60" cy="600" r="200" fill="#d95c5c" opacity="0.10"/><rect x="90" y="62" width="1020" height="520" rx="22" fill="#000" opacity="0.07" transform="translate(0,10)"/><rect x="90" y="52" width="1020" height="520" rx="22" fill="#fff"/><rect x="90" y="52" width="1020" height="64" rx="22" fill="#f6f5f1"/><rect x="90" y="96" width="1020" height="20" rx="0" fill="#f6f5f1"/><circle cx="126" cy="84" r="8" fill="#ff6159"/><circle cx="152" cy="84" r="8" fill="#ffbd2e"/><circle cx="178" cy="84" r="8" fill="#28c941"/><text x="600" y="91" font-size="19" font-weight="600" fill="#555" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Objection handling</text><g transform="translate(300,320) rotate(-10)"><rect x="-150" y="-130" width="300" height="260" rx="16" fill="#000" opacity="0.08"/><rect x="-156" y="-138" width="300" height="260" rx="16" fill="#fff" opacity="1" stroke="#ececea" stroke-width="1.5"/><circle cx="-120" cy="-92" r="20" fill="#d95c5c" opacity="0.15"/><text x="-120" y="-85" font-size="20" font-weight="700" fill="#a13d3d" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">?</text><text x="-130" y="-36" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">“Too expensive”</text><text x="-130" y="2" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Reframe around hours saved per</text><text x="-130" y="24" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">rep, per week.</text></g><g transform="translate(480,320) rotate(2)"><rect x="-150" y="-130" width="300" height="260" rx="16" fill="#000" opacity="0.08"/><rect x="-156" y="-138" width="300" height="260" rx="16" fill="#fff" opacity="1" stroke="#ececea" stroke-width="1.5"/><circle cx="-120" cy="-92" r="20" fill="#d95c5c" opacity="0.15"/><text x="-120" y="-85" font-size="20" font-weight="700" fill="#a13d3d" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">?</text><text x="-130" y="-36" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">“Happy with current tool”</text><text x="-130" y="2" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Ask what breaks today, not</text><text x="-130" y="24" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">what works.</text></g><g transform="translate(660,320) rotate(11)"><rect x="-150" y="-130" width="300" height="260" rx="16" fill="#000" opacity="0.08"/><rect x="-156" y="-138" width="300" height="260" rx="16" fill="#fff" opacity="1" stroke="#ececea" stroke-width="1.5"/><circle cx="-120" cy="-92" r="20" fill="#d95c5c" opacity="0.15"/><text x="-120" y="-85" font-size="20" font-weight="700" fill="#a13d3d" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">?</text><text x="-130" y="-36" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">“Need more time”</text><text x="-130" y="2" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Offer a scoped, two-week pilot</text><text x="-130" y="24" font-size="14" font-weight="500" fill="#555" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">instead.</text></g></svg>